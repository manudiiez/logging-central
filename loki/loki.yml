# Loki en modo single binary con almacenamiento en disco. Dimensionado para un VPS:
# sin anillo distribuido, sin object storage, un solo proceso.
#
# La retención es una decisión versionada, por eso va acá y no en una variable de
# entorno: cambiarla es un commit que se revisa.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # schema v13 + tsdb es lo que habilita structured metadata, donde van level,
    # request.id y el resto de los campos que no se indexan como labels.
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 días. Al cambiarlo, el compactor borra lo que queda fuera de la ventana.
  retention_period: 720h
  allow_structured_metadata: true
  volume_enabled: true
  # Un log con timestamp de hace más de una semana es un bug del emisor, no un log.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Topes por tenant para que una app que se vuelve loca no tire abajo el colector.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_streams_per_user: 5000
  max_line_size: 256KB
  max_query_series: 500
  max_query_lookback: 744h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  enable_api: true

# Sin telemetría a grafana.com.
analytics:
  reporting_enabled: false
