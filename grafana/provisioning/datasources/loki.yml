# Datasource provisionado por archivo: lo que está en el repo es lo que corre.
# No se edita desde la UI (editable: false) para que no haya deriva.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 2000
      timeout: 60
