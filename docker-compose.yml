# Stack local. Construye las tres imágenes desde los Dockerfiles del repo, que es
# lo mismo que publica CI; en el VPS se usa docker-compose.production.yml con los
# tags de GHCR ya construidos.
#
#   docker compose up -d --build
#   bash scripts/smoke-test.sh      # verifica que la ingesta funciona
#   Grafana en http://localhost:3000 (admin / la password de .env)

name: logging-central

services:
  loki:
    build: ./loki
    restart: unless-stopped
    ports:
      # Solo en local, para poder consultar la API desde el host (scripts/smoke-test.sh).
      # En producción Loki no se expone: Alloy y Grafana lo alcanzan por la red interna.
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    labels:
      logging: "true"
    # Sin healthcheck: la imagen de Loki es distroless, no tiene shell ni cliente HTTP
    # con el que consultar /ready desde adentro. Alloy reintenta los pushes y Grafana
    # no necesita Loki para arrancar, así que no hace falta.

  alloy:
    build: ./alloy
    restart: unless-stopped
    environment:
      SERVICE_NAMESPACE: ${SERVICE_NAMESPACE:-nazar}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      # Solo lectura: Alloy lee los logs de los contenedores, no controla Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    # Sin label `logging: true` a propósito: que Alloy recoja sus propios logs
    # arma un lazo de realimentación.
    depends_on:
      loki:
        condition: service_started

  grafana:
    build: ./grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?falta GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      logging: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      loki:
        condition: service_started

volumes:
  loki-data:
  alloy-data:
  grafana-data:
